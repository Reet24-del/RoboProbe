[project]
name = "roboprobe"
version = "0.0.1"
description = "Intelligent, simulation-based robustness testing for autonomous mobile robots."
license = "MIT"
authors = [{ name = "CodewithJha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Base dependencies (doc 15 §1). Minimums only; exact versions are pinned in uv.lock.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "uuid-utils>=0.9",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "gpytorch>=1.15",
    "botorch>=0.18",
    "scikit-learn>=1.5",
    "shap>=0.46",
]
worker = [
    "pyarrow>=17",
    "pandas>=2.2",
    "lxml>=5.0",
    "jinja2>=3.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx2>=2.0",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "pytest-benchmark>=4.0",
    "testcontainers[postgres]>=4.8",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "scipy-stubs>=1.14",
    "pyarrow-stubs>=17",
    "httpx2>=2.0",
    "mutmut>=3.3",
]

[project.scripts]
roboprobe = "roboprobe.cli.main:app"

# Optional plugins; built-in analyzers are wired in roboprobe.analysis.pipeline.
[project.entry-points."roboprobe.analyzers"]

[project.entry-points."roboprobe.backends"]
kinematic2d = "roboprobe.backends.kinematic2d.backend:Kinematic2DBackend"
replay = "roboprobe.backends.replay.backend:ReplayBackend"
benchmark = "roboprobe.backends.benchmark.backend:BenchmarkBackend"

[project.urls]
Homepage = "https://github.com/CodewithJha/RoboProbe"
Documentation = "https://github.com/CodewithJha/RoboProbe/tree/main/docs"
Issues = "https://github.com/CodewithJha/RoboProbe/issues"
Changelog = "https://github.com/CodewithJha/RoboProbe/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboprobe"]

# Ship the JSON Schemas (repository root `schemas/`) inside the wheel as `roboprobe/schemas/`;
# source checkouts read them from the repository root (roboprobe.scenario._documents).
[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "roboprobe/schemas"

# --- uv: CPU-only PyTorch wheels so CI never downloads CUDA builds (doc 15 §1, ADR-0004) ---
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
roboprobe-strategy-cem = { path = "../plugins/roboprobe_strategy_cem", editable = true }

# --- ruff (doc 16 §3) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "D", "ANN", "PL", "RUF", "S", "TRY", "ERA",
]
# D203/D213 conflict with the Google convention's D211/D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["roboprobe"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts and literal expectations are the point; docstrings optional.
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "PLR2004", "D100", "D101", "D102", "D103", "D104", "ANN"]
# FastAPI: Depends() in defaults, lazy optional imports, HTTP status literals in handlers.
"src/roboprobe/api/**/*.py" = ["B008", "PLC0415", "PLR2004", "ANN401"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy (doc 16 §3) ---
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

# --- pytest (doc 18) ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Lets tests import shared helpers as ``tests.factories`` / ``tests.fakes`` (docs/18 §5).
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not sim and not slow",
]
markers = [
    "unit: fast, isolated tests of a single unit",
    "property: Hypothesis property-based tests",
    "contract: interface/port contract tests run against every implementation",
    "integration: tests touching real infrastructure (PostgreSQL via Testcontainers, filesystem)",
    "benchmark: pytest-benchmark performance and scientific-regression gates",
    "sim: tests that need a simulator backend (Gazebo); excluded by default",
    "slow: long-running tests; excluded by default",
]
xfail_strict = true
filterwarnings = ["error"]

# --- coverage (doc 18 §3: line >= 85 %, branch >= 75 %) ---
[tool.coverage.run]
source = ["roboprobe"]
branch = true
omit = ["*/roboprobe/backends/gazebo_nav2/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # Only a bare `...` statement (Protocol / overload stubs), never e.g. `x[..., 0]`.
    "^\\s*\\.\\.\\.\\s*$",
]

# --- import-linter: layering contracts (docs/16 §2, docs/34 SOLID "D") ---
# Run with `make lint` (`lint-imports`). How to read a failure: CONTRIBUTING.md "Architecture contracts".
[tool.importlinter]
root_packages = ["roboprobe"]
# Needed so third-party packages (fastapi, sqlalchemy, rclpy) can appear in forbidden contracts.
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: interface -> application -> domain -> kernel"
type = "layers"
containers = ["roboprobe"]
# Higher layers may import lower ones, never the reverse. "|" siblings are independent of each
# other; ":" siblings share a layer and may import each other.
layers = [
    "api | cli",
    "runner : experiments : reporting",
    "selection : oracles : analysis : risk : metrics : scenario",
    "core : geometry : perturbation",
]

[[tool.importlinter.contracts]]
id = "domain-independence"
name = "Domain and kernel never depend on infrastructure, interfaces or frameworks"
type = "forbidden"
source_modules = [
    "roboprobe.selection",
    "roboprobe.oracles",
    "roboprobe.analysis",
    "roboprobe.risk",
    "roboprobe.metrics",
    "roboprobe.scenario",
    "roboprobe.core",
    "roboprobe.geometry",
    "roboprobe.perturbation",
]
forbidden_modules = [
    "roboprobe.store",
    "roboprobe.backends",
    "roboprobe.api",
    "roboprobe.bootstrap",
    "fastapi",
    "sqlalchemy",
    "rclpy",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "adapters-wired-in-bootstrap"
name = "Only bootstrap imports concrete adapters (store, backends) next to application services"
type = "forbidden"
source_modules = [
    "roboprobe.runner",
    "roboprobe.experiments",
    "roboprobe.reporting",
    "roboprobe.api",
    "roboprobe.cli",
]
forbidden_modules = ["roboprobe.store", "roboprobe.backends"]
# Direct imports only: interfaces legitimately reach adapters *through* bootstrap.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "adapters-point-inward"
name = "Adapters depend only on domain and kernel, never on application or interface layers"
type = "forbidden"
source_modules = ["roboprobe.store", "roboprobe.backends"]
forbidden_modules = [
    "roboprobe.runner",
    "roboprobe.experiments",
    "roboprobe.reporting",
    "roboprobe.bootstrap",
    "roboprobe.api",
    "roboprobe.cli",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "services-never-import-bootstrap"
name = "Application services never reach for the composition root"
type = "forbidden"
source_modules = ["roboprobe.runner", "roboprobe.experiments", "roboprobe.reporting"]
forbidden_modules = ["roboprobe.bootstrap"]
allow_indirect_imports = false

# Weekly mutation testing (T-131, docs/18 §3). Runner matches the unit/property tier.
[tool.mutmut]
# Copy the whole tree so mutant runs can still import the rest of roboprobe.
# only_mutate limits edits to the packages named in T-131 (mutmut 3.8 renamed
# paths_to_mutate to source_paths; globs are one directory deep).
source_paths = ["src"]
also_copy = ["alembic.ini"]
only_mutate = [
    "src/roboprobe/selection/*.py",
    "src/roboprobe/selection/*/*.py",
    "src/roboprobe/selection/*/*/*.py",
    "src/roboprobe/oracles/*.py",
]
# The event-catalogue test reads source text. mutmut inlines every mutant into
# those files during the stats run, so the scan cannot pass and -x would abort.
pytest_add_cli_args = [
    "-x",
    "-q",
    "-m",
    "unit or property",
    "--tb=line",
    "-k",
    "not test_every_logged_event_is_in_the_catalogue",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    "roboprobe-strategy-cem",
]
